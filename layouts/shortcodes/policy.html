{{- $title := .Get "title" -}}
<details class="group mb-2.5 rounded-md border border-hairline bg-white">
  <summary class="flex cursor-pointer list-none items-center justify-between p-4 px-5 [&::-webkit-details-marker]:hidden">
    <span class="font-sans text-[15px] font-semibold leading-snug text-ink">{{ $title }}</span>
    <span class="font-mono text-sm text-cobalt transition-transform duration-200 group-open:rotate-90">&rsaquo;</span>
  </summary>
  <div class="px-5 pb-5 font-sans text-[14.5px] leading-[1.7] text-[#3a3a3a]">
    {{ .Inner | markdownify }}
  </div>
</details>
