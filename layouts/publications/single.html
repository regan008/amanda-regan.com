{{ define "main" }}
<section class="bg-white">
  <div class="mx-auto max-w-[700px] px-14 py-16">
    <div class="mb-4 font-mono text-xs uppercase tracking-widest2 text-cobalt">{{ humanize .Params.pubtype }}{{ with .Params.year }} · {{ . }}{{ end }}</div>
    <h1 class="m-0 mb-6 font-heading text-3xl font-bold leading-tight text-ink">{{ .Title }}</h1>
    <div class="prose prose-base max-w-none text-[#454545]">{{ .Content }}</div>
    {{ with .Params.link }}<p class="mt-6"><a href="{{ . }}" target="_blank" rel="noopener noreferrer" class="font-mono text-sm text-cobalt hover:underline">view publication &rarr;</a></p>{{ end }}
    <p class="mt-10"><a href="/publications/" class="font-mono text-xs text-[#6B6B6B] hover:text-cobalt">&larr; back to publications</a></p>
  </div>
</section>
{{ end }}
