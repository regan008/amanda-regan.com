{{ define "main" }}
<section class="bg-white">
  <div class="mx-auto max-w-[1180px] px-6 sm:px-10 lg:px-14 py-[54px]">
    <article>
      <div class="mb-4 flex items-center justify-between">
        <div class="font-mono text-sm text-cobalt">{{ .Date.Format "January 2, 2006" }}</div>
        {{ partial "post-type-badge.html" (dict "type" .Params.type) }}
      </div>
      <h1 class="m-0 mb-6 font-heading text-[30px] sm:text-[40px] lg:text-[46px] font-extrabold leading-[1.08] lg:leading-[1.02] text-ink">{{ .Title }}</h1>
      <div class="prose prose-base prose-p:leading-relaxed prose-li:leading-relaxed prose-headings:font-heading prose-headings:text-ink prose-h2:text-2xl prose-p:text-[#454545] prose-a:text-cobalt prose-a:underline hover:prose-a:text-cobalt/80 max-w-[70ch]">
        {{ .Content }}
      </div>
    </article>
    <div class="mt-12 border-t border-hairline pt-8">
      <a href="/news/" class="inline-flex items-center gap-2 border-b border-cobalt pb-[3px] font-mono text-xs text-cobalt no-underline hover:text-cobalt/80">
        <svg xmlns="http://www.w3.org/2000/svg" class="h-3.5 w-3.5 rotate-180" viewBox="0 0 20 20" fill="currentColor">
          <path fill-rule="evenodd" d="M7.293 14.707a1 1 0 010-1.414L10.586 10 7.293 6.707a1 1 0 011.414-1.414l4 4a1 1 0 010 1.414l-4 4a1 1 0 01-1.414 0z" clip-rule="evenodd" />
        </svg>
        Back to all updates
      </a>
    </div>
  </div>
</section>
{{ end }}
