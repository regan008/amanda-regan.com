{{ define "main" }}
<section class="border-t border-hairline bg-white">
  <div class="mx-auto max-w-[1180px] px-14 py-[54px]">
    <h1 class="m-0 mb-7 font-heading text-3xl font-bold text-ink">News & talks</h1>
    <div class="space-y-6">
      {{ range .Pages.ByDate.Reverse }}
      <div class="rounded-md border border-hairline bg-porcelain p-6">
        <div class="mb-3 flex items-center justify-between">
          <div class="font-mono text-sm text-cobalt">{{ .Date.Format "January 2, 2006" }}</div>
          {{ partial "post-type-badge.html" (dict "type" .Params.type) }}
        </div>
        <h2 class="m-0 mb-3 font-heading text-xl font-bold text-ink">
          <a href="{{ .RelPermalink }}" class="text-ink no-underline hover:text-cobalt">{{ .Title }}</a>
        </h2>
        <div class="font-sans text-base text-[#454545] [&_a]:text-cobalt [&_a]:underline">
          {{ .Content }}
        </div>
      </div>
      {{ end }}
    </div>
  </div>
</section>
{{ end }}
