{{- $text := .text -}}
{{- $right := .right -}}
<div class="mb-7 flex items-center gap-3.5">
  <span class="font-mono text-[11px] uppercase tracking-widest2 text-cobalt">{{ $text }}</span>
  <span class="h-px flex-1 bg-ink/[.16]"></span>
  {{ with $right }}<span class="font-mono text-[11px] uppercase tracking-widest2 text-[#6B6B6B]">{{ . }}</span>{{ end }}
</div>
