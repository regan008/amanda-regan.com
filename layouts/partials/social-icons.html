{{- $social := .site.Params.social -}}
<div class="flex items-center gap-4">
  {{ with $social.email }}
  <a href="mailto:{{ . }}" data-event="Social Icon Click" data-event-platform="email" class="text-[#6B6B6B] hover:text-cobalt transition-colors" aria-label="Email">
    <i class="fas fa-envelope text-lg"></i>
  </a>
  {{ end }}
  {{ with $social.github }}
  <a href="https://github.com/{{ . }}" data-event="Social Icon Click" data-event-platform="github" target="_blank" rel="noopener noreferrer" class="text-[#6B6B6B] hover:text-cobalt transition-colors" aria-label="GitHub">
    <i class="fab fa-github text-lg"></i>
  </a>
  {{ end }}
  {{ with $social.linkedin }}
  <a href="https://www.linkedin.com/in/{{ . }}/" data-event="Social Icon Click" data-event-platform="linkedin" target="_blank" rel="noopener noreferrer" class="text-[#6B6B6B] hover:text-cobalt transition-colors" aria-label="LinkedIn">
    <i class="fab fa-linkedin text-lg"></i>
  </a>
  {{ end }}
  {{ with $social.bluesky }}
  <a href="https://bsky.app/profile/{{ . }}" data-event="Social Icon Click" data-event-platform="bluesky" target="_blank" rel="noopener noreferrer" class="text-[#6B6B6B] hover:text-cobalt transition-colors" aria-label="Bluesky">
    <i class="fa-brands fa-bluesky text-lg"></i>
  </a>
  {{ end }}
  {{ with $social.orcid }}
  <a href="https://orcid.org/{{ . }}" data-event="Social Icon Click" data-event-platform="orcid" target="_blank" rel="noopener noreferrer" class="text-[#6B6B6B] hover:text-cobalt transition-colors" aria-label="ORCID">
    <i class="fab fa-orcid text-lg"></i>
  </a>
  {{ end }}
  {{ with $social.scholar }}
  <a href="https://scholar.google.com/citations?user={{ . }}" data-event="Social Icon Click" data-event-platform="scholar" target="_blank" rel="noopener noreferrer" class="text-[#6B6B6B] hover:text-cobalt transition-colors" aria-label="Google Scholar">
    <i class="fas fa-graduation-cap text-lg"></i>
  </a>
  {{ end }}
  {{ with $social.department }}
  <a href="{{ . }}" data-event="Social Icon Click" data-event-platform="department" target="_blank" rel="noopener noreferrer" class="text-[#6B6B6B] hover:text-cobalt transition-colors" aria-label="Clemson Faculty Profile">
    <i class="fas fa-building text-lg"></i>
  </a>
  {{ end }}
</div>
