{{- $eyebrow := .eyebrow -}}
{{- $title := .title -}}
{{- $intro := .intro -}}
<section class="bg-porcelain">
  <div class="mx-auto max-w-[1040px] px-14 pb-10 pt-[60px]">
    {{ partial "eyebrow.html" (dict "text" $eyebrow) }}
    <h1 class="m-0 mb-4 font-heading text-[46px] font-extrabold leading-[1.02] tracking-tight text-ink">{{ $title }}</h1>
    <div class="mb-[22px] h-0.5 w-11 bg-cobalt"></div>
    {{ with $intro }}<p class="m-0 max-w-[62ch] font-sans text-lg leading-[1.6] text-[#454545]">{{ . | safeHTML }}</p>{{ end }}
  </div>
</section>
