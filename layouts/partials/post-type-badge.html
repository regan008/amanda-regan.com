{{- $type := .type | default "news" -}}
{{- if eq $type "talk" -}}
  <span class="inline-flex items-center gap-1.5 font-mono text-xs text-cobalt">
    <svg class="h-3.5 w-3.5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
      <path d="M12 2c-2.2 0-4 1.8-4 4 0 3 3 5.3 4 8 1-2.7 4-5 4-8 0-2.2-1.8-4-4-4z"></path>
      <path d="M8 20h8"></path>
      <path d="M9 22h6"></path>
    </svg>
    <span class="uppercase tracking-wider">Talk</span>
  </span>
{{- else -}}
  <span class="inline-flex items-center gap-1.5 font-mono text-xs text-[#888]">
    <svg class="h-3.5 w-3.5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
      <path d="M13 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V9z"></path>
      <polyline points="13 2 13 9 20 9"></polyline>
    </svg>
    <span class="uppercase tracking-wider">News</span>
  </span>
{{- end -}}
