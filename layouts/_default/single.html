{{ define "main" }}
<section class="bg-white">
  <div class="mx-auto max-w-[760px] px-6 sm:px-10 lg:px-14 py-16">
    <h1 class="m-0 mb-8 font-heading text-4xl font-extrabold tracking-tight text-ink">{{ .Title }}</h1>
    <article class="prose prose-base max-w-none font-sans text-[#3a3a3a] prose-headings:font-heading prose-headings:text-ink prose-a:text-cobalt prose-a:no-underline hover:prose-a:underline prose-img:my-0 prose-p:leading-relaxed prose-li:leading-relaxed">
      {{ .Content }}
    </article>
  </div>
</section>
{{ end }}
