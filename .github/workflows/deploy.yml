name: Deploy Site

on:
  push:
    branches:
      - main
      - hugo-main

jobs:
  deploy:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install npm dependencies
        run: npm ci

      - name: Build CSS
        run: npm run css:build

      - name: Set up Hugo
        uses: peaceiris/actions-hugo@v2
        with:
          hugo-version: 'latest'
          extended: true

      - name: Build Hugo site
        run: hugo --gc --minify
        continue-on-error: false

      - name: Fix file permissions
        run: |
          if [ -d "public" ]; then
            find public/ -type d -exec chmod 755 {} \;
            find public/ -type f -exec chmod 644 {} \;
          else
            echo "Warning: public/ directory not found"
            exit 1
          fi

      - name: Set up SSH key
        run: |
          set -e  # Exit on any error
          set -x  # Debug mode - show all commands
          
          echo "=== Starting SSH setup ==="
          
          # Create .ssh directory
          echo "Creating .ssh directory..."
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          
          # Validate secrets are set
          echo "Validating secrets..."
          if [ -z "${{ secrets.SSH_PRIVATE_KEY }}" ]; then
            echo "❌ Error: SSH_PRIVATE_KEY secret is not set"
            exit 1
          fi
          echo "✅ SSH_PRIVATE_KEY secret is set"
          
          if [ -z "${{ secrets.SSH_USER }}" ]; then
            echo "❌ Error: SSH_USER secret is not set"
            exit 1
          fi
          echo "✅ SSH_USER secret is set: ${{ secrets.SSH_USER }}"
          
          # Write SSH private key
          echo "Writing SSH private key..."
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          
          # Verify the key file was created and has content
          if [ ! -s ~/.ssh/deploy_key ]; then
            echo "❌ Error: SSH key file is empty or not created"
            exit 1
          fi
          echo "✅ SSH key file created ($(wc -l < ~/.ssh/deploy_key) lines)"
          
          # Initialize known_hosts file if it doesn't exist
          touch ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts
          
          # Scan host keys (with error handling)
          echo "Scanning SSH host keys for amanda-regan.com..."
          if ssh-keyscan -H amanda-regan.com >> ~/.ssh/known_hosts 2>&1; then
            echo "✅ Host keys scanned successfully"
          else
            echo "⚠️  Warning: ssh-keyscan failed, but continuing..."
            echo "This is usually okay if the host is unreachable temporarily"
          fi
          
          # Configure SSH config
          echo "Configuring SSH config..."
          {
            echo "Host amanda-regan.com"
            echo "  HostName amanda-regan.com"
            echo "  User ${{ secrets.SSH_USER }}"
            echo "  IdentityFile ~/.ssh/deploy_key"
            echo "  IdentitiesOnly yes"
            echo "  StrictHostKeyChecking yes"
            echo "  UserKnownHostsFile ~/.ssh/known_hosts"
          } >> ~/.ssh/config
          chmod 600 ~/.ssh/config
          
          echo "✅ SSH setup complete"
          echo "=== SSH config contents ==="
          cat ~/.ssh/config

      - name: Test SSH connection
        run: |
          echo "Testing SSH connection to amanda-regan.com..."
          if ssh -o IdentitiesOnly=yes -o ConnectTimeout=10 amanda-regan.com "echo 'SSH connection successful'" 2>&1; then
            echo "✅ SSH connection test passed"
          else
            echo "❌ SSH connection test failed"
            echo "Debugging information:"
            echo "SSH config:"
            cat ~/.ssh/config
            echo "Known hosts:"
            cat ~/.ssh/known_hosts || echo "No known_hosts file"
            exit 1
          fi
        continue-on-error: false

      - name: Deploy to server
        run: |
          rsync -avz --chmod=Du=rwx,Dgo=rx,Fu=rw,Fgo=r \
            -e "ssh -o IdentitiesOnly=yes -i ~/.ssh/deploy_key" \
            public/ \
            ${{ secrets.SSH_USER }}@amanda-regan.com:~/public_html/
        continue-on-error: false

      - name: Deployment complete
        run: echo "🎉 Site deployed successfully!"
