name: Deploy Site

on:
  push:
    branches:
      - main
      - hugo-main

jobs:
  deploy:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install npm dependencies
        run: npm ci

      - name: Build CSS
        run: npm run css:build

      - name: Set up Hugo
        uses: peaceiris/actions-hugo@v2
        with:
          hugo-version: 'latest'
          extended: true

      - name: Build Hugo site
        run: hugo --gc --minify
        continue-on-error: false

      - name: Fix file permissions
        run: |
          if [ -d "public" ]; then
            find public/ -type d -exec chmod 755 {} \;
            find public/ -type f -exec chmod 644 {} \;
          else
            echo "Warning: public/ directory not found"
            exit 1
          fi

      - name: Set up SSH key
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H amanda-regan.com >> ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts
          # Configure SSH to only use our specific key
          cat >> ~/.ssh/config << EOF
          Host amanda-regan.com
            HostName amanda-regan.com
            User ${{ secrets.SSH_USER }}
            IdentityFile ~/.ssh/deploy_key
            IdentitiesOnly yes
            StrictHostKeyChecking yes
          EOF
          chmod 600 ~/.ssh/config

      - name: Test SSH connection
        run: |
          ssh -v -o IdentitiesOnly=yes amanda-regan.com "echo 'SSH connection successful'"
        continue-on-error: true

      - name: Deploy to server
        run: |
          rsync -avz --chmod=Du=rwx,Dgo=rx,Fu=rw,Fgo=r \
            -e "ssh -o IdentitiesOnly=yes -i ~/.ssh/deploy_key" \
            public/ \
            ${{ secrets.SSH_USER }}@amanda-regan.com:~/public_html/
        continue-on-error: false

      - name: Deployment complete
        run: echo "🎉 Site deployed successfully!"
