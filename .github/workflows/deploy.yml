name: Deploy Site

on:
  push:
    branches:
      - main
      - hugo-main

jobs:
  deploy:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install npm dependencies
        run: npm ci

      - name: Build CSS
        run: npm run css:build

      - name: Set up Hugo
        uses: peaceiris/actions-hugo@v2
        with:
          hugo-version: 'latest'
          extended: true

      - name: Build Hugo site
        run: hugo --gc --minify
        continue-on-error: false

      - name: Fix file permissions
        run: |
          if [ -d "public" ]; then
            find public/ -type d -exec chmod 755 {} \;
            find public/ -type f -exec chmod 644 {} \;
          else
            echo "Warning: public/ directory not found"
            exit 1
          fi

      - name: Set up SSH
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: Configure SSH
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          ssh-keyscan -H amanda-regan.com >> ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts
          # Configure SSH to only use the key from the agent
          cat >> ~/.ssh/config << EOF
          Host amanda-regan.com
            IdentitiesOnly yes
            IdentityAgent $SSH_AUTH_SOCK
            StrictHostKeyChecking yes
          EOF
          chmod 600 ~/.ssh/config

      - name: Deploy to server
        run: |
          rsync -avz --chmod=Du=rwx,Dgo=rx,Fu=rw,Fgo=r \
            -e "ssh -o IdentitiesOnly=yes" \
            public/ \
            ${{ secrets.SSH_USER }}@amanda-regan.com:~/public_html/
        continue-on-error: false

      - name: Deployment complete
        run: echo "🎉 Site deployed successfully!"
